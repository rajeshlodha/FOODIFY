<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurants - FOODIFY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="notification" class="notification"></div>

<header class="navbar">
<div class="nav-left">
<div class="logo">
<img src="images/logo.jpg" alt="Foodify Logo">
</div>
</div>

<nav class="nav-links">
<a href="index.html">Home</a>
<a href="restaurant.html">Restaurants</a>
<a href="orders.html">My Orders</a>
<a href="profile.html">Profile</a>
<a href="admin.html">Admin</a>
</nav>

<div class="nav-right">
<div class="cart-icon" id="cartIcon">
Cart
<span class="cart-count" id="cartCount">0</span>
</div>
<button class="login-btn" id="loginBtn">Login</button>
</div>
</header>

<main class="restaurants-page">
<div class="restaurants-page-header">
<span class="page-kicker">Foodify restaurants</span>
<h1>All Restaurants</h1>
<p>Filter, sort, and find your next meal.</p>
</div>

<div class="filters-container">
<div class="filter-section">
<h4>Filters</h4>

<div class="restaurant-search-control">
<input type="search" id="restaurantSearch" placeholder="Search restaurants, cuisines, or dishes..." aria-label="Search restaurants, cuisines, or dishes">
</div>

<div class="filter-group">
<label class="filter-pill">
<input type="checkbox" id="vegFilter" class="filter-checkbox"> Vegetarian Only
</label>
<label class="filter-pill">
<input type="checkbox" id="nonVegFilter" class="filter-checkbox"> Non-Vegetarian
</label>
<label class="filter-pill">
<input type="checkbox" id="ratingFilter" class="filter-checkbox"> Rating 4.0+
</label>
<label class="filter-pill">
<input type="checkbox" id="priceFilter" class="filter-checkbox"> Under Rs 200
</label>
<label class="filter-pill">
<input type="checkbox" id="fastDeliveryFilter" class="filter-checkbox"> Fast Delivery (30 min or less)
</label>
</div>

<button id="clearFiltersBtn" class="clear-btn">Clear All Filters</button>
</div>

<div class="sort-section">
<h4>Sort</h4>
<select id="sortSelect">
<option value="rating">Best Rated</option>
<option value="price-low">Price: Low to High</option>
<option value="price-high">Price: High to Low</option>
<option value="delivery-time">Fastest Delivery</option>
</select>
</div>
</div>

<div id="restaurantGrid" class="restaurant-grid">
<!-- Restaurants will be populated here -->
</div>
</main>

<div class="cart-panel" id="cartPanel">
<div class="cart-header">
<h3>Your Cart</h3>
<button class="close-cart" onclick="toggleCart()">x</button>
</div>
<ul id="cartItems"></ul>
<p>Total: Rs <span id="total">0</span></p>
<button onclick="checkout()">Checkout</button>
<button onclick="clearCart()">Clear Cart</button>
</div>

<div class="login-modal" id="loginModal">
<div class="login-box">
<div class="login-header">
<h3>Login</h3>
<button class="modal-close" onclick="closeLogin()">x</button>
</div>
<input type="text" placeholder="Username" required aria-label="Username">
<input type="password" placeholder="Password" required aria-label="Password">
<button onclick="closeLogin()">Login</button>
</div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script src="orders.js"></script>
<script>
let allRestaurants = getAllRestaurants();
let filteredRestaurants = [...allRestaurants];

function initRestaurantsPage() {
  filteredRestaurants = sortRestaurants(filteredRestaurants, 'rating');
  displayRestaurants(filteredRestaurants);
  setupFilterListeners();
}

function setupFilterListeners() {
  document.getElementById('vegFilter').addEventListener('change', applyFilters);
  document.getElementById('nonVegFilter').addEventListener('change', applyFilters);
  document.getElementById('ratingFilter').addEventListener('change', applyFilters);
  document.getElementById('priceFilter').addEventListener('change', applyFilters);
  document.getElementById('fastDeliveryFilter').addEventListener('change', applyFilters);
  document.getElementById('restaurantSearch').addEventListener('input', applyFilters);
  document.getElementById('sortSelect').addEventListener('change', applyFilters);
  document.getElementById('clearFiltersBtn').addEventListener('click', clearAllFilters);
}

function applyFilters() {
  const searchTerm = document.getElementById('restaurantSearch').value.trim().toLowerCase();
  const filters = {
    veg: document.getElementById('vegFilter').checked,
    nonVeg: document.getElementById('nonVegFilter').checked,
    rating: document.getElementById('ratingFilter').checked ? 4.0 : 0,
    maxPrice: document.getElementById('priceFilter').checked ? 200 : Infinity,
    minDelivery: document.getElementById('fastDeliveryFilter').checked ? 'fast' : null
  };

  const sortBy = document.getElementById('sortSelect').value;
  const searchedRestaurants = allRestaurants.filter(restaurant => {
    if (!searchTerm) return true;

    const matchesName = restaurant.name.toLowerCase().includes(searchTerm);
    const matchesCuisine = restaurant.cuisine.some(cuisine => cuisine.toLowerCase().includes(searchTerm));
    const matchesFood = restaurant.foods.some(food =>
      food.name.toLowerCase().includes(searchTerm) ||
      food.category.toLowerCase().includes(searchTerm)
    );

    return matchesName || matchesCuisine || matchesFood;
  });

  filteredRestaurants = sortRestaurants(filterRestaurants(searchedRestaurants, filters), sortBy);
  displayRestaurants(filteredRestaurants);
}

function clearAllFilters() {
  document.querySelectorAll('.filter-checkbox').forEach(cb => cb.checked = false);
  document.getElementById('restaurantSearch').value = '';
  document.getElementById('sortSelect').value = 'rating';
  filteredRestaurants = sortRestaurants([...allRestaurants], 'rating');
  displayRestaurants(filteredRestaurants);
}

function displayRestaurants(restaurants) {
  const grid = document.getElementById('restaurantGrid');
  grid.innerHTML = '';

  if (restaurants.length === 0) {
    grid.innerHTML = '<p class="empty-state" style="grid-column:1/-1;">No restaurants match your filters.</p>';
    return;
  }

  const favorites = JSON.parse(localStorage.getItem('favorites') || '{"restaurants":[], "foods":[]}');

  restaurants.forEach(restaurant => {
    const prices = restaurant.foods.map(food => food.price);
    const minPrice = prices.length ? Math.min(...prices) : 0;
    const hasNonVeg = restaurant.foods.some(food => !food.veg);
    const isFav = favorites.restaurants && favorites.restaurants.includes(restaurant.id);

    const card = document.createElement('article');
    card.className = 'restaurant-card restaurant-list-card';
    card.innerHTML = `
      <div class="restaurant-card-image">
        <img src="${restaurant.image}" alt="${restaurant.name}">
        <span class="rating-badge">Star ${restaurant.rating}</span>
        <button class="favorite-btn ${isFav ? 'active' : ''}" onclick="toggleFavoriteRestaurant('${restaurant.id}')" aria-label="Toggle ${restaurant.name} favorite">
          ${isFav ? 'Heart' : 'Save'}
        </button>
      </div>
      <div class="restaurant-info">
        <h3>${restaurant.name}</h3>
        <p class="cuisine">${restaurant.cuisine.join(' / ')}</p>
        <div class="restaurant-meta">
          <span>${restaurant.deliveryTime}</span>
          <span>Rs ${minPrice}+</span>
          <span>${hasNonVeg ? 'Veg & Non-Veg' : 'Veg Only'}</span>
        </div>
        <a href="restaurant_detail.html?id=${restaurant.id}" class="view-menu-btn">View Menu</a>
      </div>
    `;
    grid.appendChild(card);
  });
}

function toggleFavoriteRestaurant(restaurantId) {
  const favorites = JSON.parse(localStorage.getItem('favorites') || '{"restaurants":[], "foods":[]}');
  if (!favorites.restaurants) favorites.restaurants = [];

  const index = favorites.restaurants.indexOf(restaurantId);
  if (index > -1) {
    favorites.restaurants.splice(index, 1);
  } else {
    favorites.restaurants.push(restaurantId);
  }

  localStorage.setItem('favorites', JSON.stringify(favorites));
  applyFilters();
  showNotification('Favorite updated!');
}

window.addEventListener('load', initRestaurantsPage);
</script>
</body>
</html>
