<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - FOODIFY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="notification" class="notification"></div>

<header class="navbar">
<div class="nav-left">
<div class="logo">
<img src="images/logo.jpg" alt="Foodify Logo">
</div>
</div>

<nav class="nav-links">
<a href="index.html">Home</a>
<a href="restaurant.html">Restaurants</a>
<a href="orders.html">My Orders</a>
<a href="profile.html">Profile</a>
<a href="admin.html">Admin</a>
</nav>
<div class="nav-right">
<div class="cart-icon" id="cartIcon">
🛒
<span class="cart-count" id="cartCount">0</span>
</div>
<button class="logout-btn" id="logoutBtn" style="display:none;">Logout</button>
</div>
</header>

<section class="profile-page">
<div class="profile-container">
<div class="profile-sidebar">
<div class="profile-menu">
<button class="menu-item active" data-tab="account">Account Details</button>
<button class="menu-item" data-tab="addresses">Saved Addresses</button>
<button class="menu-item" data-tab="orders">Previous Orders</button>
<button class="menu-item" data-tab="favorites">Favorite Restaurants</button>
<button class="menu-item" data-tab="payments">Payment Methods</button>
</div>
</div>

<div class="profile-content">
<!-- Account Tab -->
<div id="accountTab" class="profile-tab active">
<h2>Account Details</h2>
<form id="accountForm" class="profile-form">
<div class="form-group">
<label>Full Name</label>
<input type="text" id="fullName" placeholder="Enter your full name">
</div>
<div class="form-group">
<label>Email</label>
<input type="email" id="email" placeholder="Enter your email">
</div>
<div class="form-group">
<label>Phone Number</label>
<input type="tel" id="phone" placeholder="Enter your phone number">
</div>
<button type="submit" class="save-btn">Save Changes</button>
</form>
</div>

<!-- Addresses Tab -->
<div id="addressesTab" class="profile-tab">
<h2>Saved Addresses</h2>
<div id="addressesList" class="addresses-list">
<!-- Addresses will be populated here -->
</div>
<button id="addAddressBtn" class="add-btn">+ Add New Address</button>

<div id="addressFormModal" class="modal" style="display:none;">
<div class="modal-content">
<div class="modal-header">
<h3>Add New Address</h3>
<button class="modal-close" onclick="closeAddressModal()">✕</button>
</div>
<form id="addressForm" class="address-form">
<div class="form-group">
<label>Address Type</label>
<select id="addressType" required>
<option value="">Select Type</option>
<option value="home">Home</option>
<option value="work">Work</option>
<option value="other">Other</option>
</select>
</div>
<div class="form-group">
<label>Full Address</label>
<textarea id="fullAddress" placeholder="Enter complete address" required></textarea>
</div>
<div class="form-group">
<label>Landmark (Optional)</label>
<input type="text" id="landmark" placeholder="Nearby landmark">
</div>
<div class="form-group">
<label>Phone Number</label>
<input type="tel" id="addressPhone" placeholder="Phone number" required>
</div>
<div class="form-group">
<label>
<input type="checkbox" id="setDefault"> Set as default address
</label>
</div>
<button type="submit" class="save-btn">Save Address</button>
</form>
</div>
</div>
</div>

<!-- Orders Tab -->
<div id="ordersTab" class="profile-tab">
<h2>Previous Orders</h2>
<div id="ordersList" class="orders-list">
<!-- Previous orders will be populated here -->
</div>
</div>

<!-- Favorites Tab -->
<div id="favoritesTab" class="profile-tab">
<h2>Favorite Restaurants</h2>
<div id="favoritesList" class="favorites-grid">
<!-- Favorite restaurants will be populated here -->
</div>
</div>

<!-- Payments Tab -->
<div id="paymentsTab" class="profile-tab">
<h2>Payment Methods</h2>
<div id="paymentsList" class="payments-list">
<!-- Payment methods will be populated here -->
</div>
<button id="addPaymentBtn" class="add-btn">+ Add Payment Method</button>

<div id="paymentFormModal" class="modal" style="display:none;">
<div class="modal-content">
<div class="modal-header">
<h3>Add Payment Method</h3>
<button class="modal-close" onclick="closePaymentModal()">x</button>
</div>
<form id="paymentForm" class="address-form">
<div class="form-group">
<label>Payment Type</label>
<select id="paymentType" required>
<option value="">Select Type</option>
<option value="card">Card</option>
<option value="upi">UPI</option>
<option value="wallet">Wallet</option>
</select>
</div>
<div class="form-group">
<label>Card Number / UPI / Wallet ID</label>
<input type="text" id="paymentValue" placeholder="Enter payment detail" required>
</div>
<button type="submit" class="save-btn">Save Payment Method</button>
</form>
</div>
</div>
</div>
</div>
</div>
</section>

<div class="cart-panel" id="cartPanel">
<div class="cart-header">
<h3>Your Cart</h3>
<button class="close-cart" onclick="toggleCart()">✕</button>
</div>
<ul id="cartItems">
</ul>
<p>Total: ₹<span id="total">0</span></p>
<button onclick="checkout()">Checkout</button>
<button onclick="clearCart()">Clear Cart</button>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script src="orders.js"></script>
<script>
// User Profile Page
let userProfile = normalizeProfile(JSON.parse(localStorage.getItem('userProfile') || JSON.stringify(defaultUser)));

function normalizeProfile(profile) {
  return {
    ...defaultUser,
    ...profile,
    addresses: Array.isArray(profile.addresses) ? profile.addresses : [],
    previousOrders: Array.isArray(profile.previousOrders) ? profile.previousOrders : [],
    savedPaymentMethods: Array.isArray(profile.savedPaymentMethods) ? profile.savedPaymentMethods : []
  };
}

function saveProfile() {
  localStorage.setItem('userProfile', JSON.stringify(userProfile));
}

function initProfilePage() {
  // Setup tab switching
  document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', switchTab);
  });
  
  // Setup form submissions
  document.getElementById('accountForm').addEventListener('submit', saveAccountDetails);
  document.getElementById('addressForm').addEventListener('submit', saveAddress);
  document.getElementById('addAddressBtn').addEventListener('click', openAddressModal);
  document.getElementById('paymentForm').addEventListener('submit', savePaymentMethod);
  document.getElementById('addPaymentBtn').addEventListener('click', openPaymentModal);
  
  // Load profile data
  loadProfileData();
  displayAddresses();
  displayPreviousOrders();
  displayFavorites();
  displayPaymentMethods();
  
  // Setup logout button
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) {
    logoutBtn.onclick = () => {
      if (confirm('Are you sure you want to logout?')) {
        sessionStorage.removeItem('adminLoggedIn');
        window.location.href = 'index.html';
      }
    };
  }
}

function switchTab(e) {
  const tabName = e.target.dataset.tab;
  
  document.querySelectorAll('.profile-tab').forEach(tab => {
    tab.classList.remove('active');
  });
  document.querySelectorAll('.menu-item').forEach(item => {
    item.classList.remove('active');
  });
  
  document.getElementById(tabName + 'Tab').classList.add('active');
  e.target.classList.add('active');
}

function loadProfileData() {
  document.getElementById('fullName').value = userProfile.name || '';
  document.getElementById('email').value = userProfile.email || '';
  document.getElementById('phone').value = userProfile.phone || '';
}

function saveAccountDetails(e) {
  e.preventDefault();
  
  userProfile.name = document.getElementById('fullName').value;
  userProfile.email = document.getElementById('email').value;
  userProfile.phone = document.getElementById('phone').value;
  
  saveProfile();
  showNotification('Profile updated successfully!');
}

function openAddressModal() {
  document.getElementById('addressFormModal').style.display = 'flex';
}

function closeAddressModal() {
  document.getElementById('addressFormModal').style.display = 'none';
  document.getElementById('addressForm').reset();
}

function saveAddress(e) {
  e.preventDefault();
  
  const address = {
    id: Date.now(),
    type: document.getElementById('addressType').value,
    fullAddress: document.getElementById('fullAddress').value,
    landmark: document.getElementById('landmark').value,
    phone: document.getElementById('addressPhone').value,
    isDefault: document.getElementById('setDefault').checked
  };
  
  if (address.isDefault) {
    userProfile.addresses.forEach(a => a.isDefault = false);
  }
  
  userProfile.addresses.push(address);
  userProfile.defaultAddress = address.id;
  
  saveProfile();
  closeAddressModal();
  displayAddresses();
  showNotification('Address saved successfully!');
}

function deleteAddress(id) {
  if (confirm('Are you sure you want to delete this address?')) {
    userProfile.addresses = userProfile.addresses.filter(a => a.id !== id);
    saveProfile();
    displayAddresses();
    showNotification('Address deleted!');
  }
}

function displayAddresses() {
  const container = document.getElementById('addressesList');
  
  if (userProfile.addresses.length === 0) {
    container.innerHTML = '<p class="empty-state">No saved addresses yet. Add one to get started!</p>';
    return;
  }
  
  let html = '';
  userProfile.addresses.forEach(address => {
    html += `
      <div class="address-card ${address.isDefault ? 'default' : ''}">
        <div class="address-header">
          <h4>${address.type.toUpperCase()}</h4>
          ${address.isDefault ? '<span class="default-badge">Default</span>' : ''}
        </div>
        <p class="address-text">${address.fullAddress}</p>
        ${address.landmark ? `<p class="landmark">Landmark: ${address.landmark}</p>` : ''}
        <p class="phone">📞 ${address.phone}</p>
        <div class="address-actions">
          <button onclick="setDefaultAddress(${address.id})" class="btn-small">Set as Default</button>
          <button onclick="deleteAddress(${address.id})" class="btn-small btn-danger">Delete</button>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

function setDefaultAddress(id) {
  userProfile.defaultAddress = id;
  userProfile.addresses.forEach(a => {
    a.isDefault = a.id === id;
  });
  saveProfile();
  displayAddresses();
  showNotification('Default address updated!');
}

function displayPreviousOrders() {
  const container = document.getElementById('ordersList');
  const foodifyOrders = JSON.parse(localStorage.getItem('foodifyOrders') || '[]');
  const orders = userProfile.previousOrders.length ? userProfile.previousOrders : foodifyOrders;
  
  if (!orders || orders.length === 0) {
    container.innerHTML = '<p class="empty-state">No previous orders yet. Start ordering now!</p>';
    return;
  }
  
  let html = '';
  orders.forEach(order => {
    html += `
      <div class="order-card">
        <div class="order-header">
          <h4>Order #${order.id}</h4>
          <span class="order-date">${new Date(order.date || order.timestamp || Date.now()).toLocaleDateString()}</span>
        </div>
        <p class="restaurant">🏪 ${order.restaurant}</p>
        <div class="order-items">
          ${(order.items || []).map(item => `<span>${item.name} x${item.qty}</span>`).join(', ')}
        </div>
        <div class="order-footer">
          <span class="amount">₹${order.total}</span>
          <span class="status">${order.status}</span>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

function displayFavorites() {
  const container = document.getElementById('favoritesList');
  const favorites = JSON.parse(localStorage.getItem('favorites') || '{"restaurants":[], "foods":[]}');
  
  if (!favorites.restaurants || favorites.restaurants.length === 0) {
    container.innerHTML = '<p class="empty-state">No favorite restaurants yet. Mark your favorites from the restaurants page!</p>';
    return;
  }
  
  let html = '';
  favorites.restaurants.forEach(restaurantId => {
    const restaurant = getRestaurant(restaurantId);
    if (restaurant) {
      html += `
        <div class="favorite-card">
          <img src="${restaurant.image}" alt="${restaurant.name}">
          <h4>${restaurant.name}</h4>
          <p>${restaurant.cuisine.join(' • ')}</p>
          <p class="rating">⭐ ${restaurant.rating}</p>
          <a href="restaurant_detail.html?id=${restaurant.id}" class="btn-primary">View Menu</a>
        </div>
      `;
    }
  });
  
  container.innerHTML = html;
}

function displayPaymentMethods() {
  const container = document.getElementById('paymentsList');
  
  if (!userProfile.savedPaymentMethods || userProfile.savedPaymentMethods.length === 0) {
    container.innerHTML = '<p class="empty-state">No saved payment methods. Add one for faster checkout!</p>';
    return;
  }
  
  let html = '';
  userProfile.savedPaymentMethods.forEach((method, index) => {
    html += `
      <div class="payment-card">
        <div class="payment-type">💳 ${method.type.toUpperCase()}</div>
        <p class="payment-details">${method.number || method.email}</p>
        <div class="payment-actions">
          <button onclick="deletePaymentMethod(${index})" class="btn-small btn-danger">Delete</button>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

function openPaymentModal() {
  document.getElementById('paymentFormModal').style.display = 'flex';
}

function closePaymentModal() {
  document.getElementById('paymentFormModal').style.display = 'none';
  document.getElementById('paymentForm').reset();
}

function maskPaymentValue(value) {
  if (value.length <= 4) return value;
  return '*'.repeat(Math.max(0, value.length - 4)) + value.slice(-4);
}

function savePaymentMethod(e) {
  e.preventDefault();

  const value = document.getElementById('paymentValue').value.trim();
  userProfile.savedPaymentMethods.push({
    type: document.getElementById('paymentType').value,
    number: maskPaymentValue(value),
    email: ''
  });

  saveProfile();
  closePaymentModal();
  displayPaymentMethods();
  showNotification('Payment method saved!');
}

function deletePaymentMethod(index) {
  if (confirm('Are you sure you want to delete this payment method?')) {
    userProfile.savedPaymentMethods.splice(index, 1);
    saveProfile();
    displayPaymentMethods();
    showNotification('Payment method deleted!');
  }
}

window.addEventListener('load', initProfilePage);
</script>
</body>
</html>
