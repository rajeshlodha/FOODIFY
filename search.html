<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Results - FOODIFY</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="notification" class="notification"></div>

<header class="navbar">
<div class="nav-left">
<div class="logo">
<img src="images/logo.jpg" alt="Foodify Logo">
</div>
</div>

<nav class="nav-links">
<a href="index.html">Home</a>
<a href="restaurant.html">Restaurants</a>
<a href="orders.html">My Orders</a>
<a href="profile.html">Profile</a>
<a href="admin.html">Admin</a>
</nav>
<div class="nav-right">
<div class="cart-icon" id="cartIcon">
🛒
<span class="cart-count" id="cartCount">0</span>
</div>
<button class="login-btn" id="loginBtn">Login</button>
</div>
</header>

<section class="search-page">
<div class="search-header">
<h2 id="searchTitle">Search Results</h2>
<div class="search-bar-container">
<input type="text" id="newSearchInput" placeholder="Search for food or restaurants..." aria-label="Search for food or restaurants">
<button id="newSearchBtn">Search</button>
</div>
</div>

<div class="search-filters">
<button class="filter-btn active" data-filter="all">All Results</button>
<button class="filter-btn" data-filter="restaurants">Restaurants</button>
<button class="filter-btn" data-filter="foods">Food Items</button>
</div>

<div class="search-options">
<label>
<input type="checkbox" id="vegOnly" > Show Veg Only
</label>
<select id="sortBy">
<option value="relevance">Sort by Relevance</option>
<option value="price-low">Price: Low to High</option>
<option value="price-high">Price: High to Low</option>
<option value="rating">Best Rated</option>
<option value="delivery-time">Fastest Delivery</option>
</select>
</div>

<div id="resultsContainer" class="results-container">
<div class="results-loading">Loading results...</div>
</div>
</section>

<div class="cart-panel" id="cartPanel">
<div class="cart-header">
<h3>Your Cart</h3>
<button class="close-cart" onclick="toggleCart()">✕</button>
</div>
<ul id="cartItems">
</ul>
<p>Total: ₹<span id="total">0</span></p>
<button onclick="checkout()">Checkout</button>
<button onclick="clearCart()">Clear Cart</button>
</div>

<div class="login-modal" id="loginModal">
<div class="login-box">
<div class="login-header">
<h3>Login</h3>
<button class="modal-close" onclick="closeLogin()">✕</button>
</div>
<input type="text" placeholder="Username" required aria-label="Username">
<input type="password" placeholder="Password" required aria-label="Password">
<button onclick="closeLogin()">Login</button>
</div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
<script src="orders.js"></script>
<script>
// Search Results Page Logic
let currentSearchQuery = '';
let currentFilter = 'all';
let currentVegOnly = false;
let currentSortBy = 'relevance';

function initSearchPage() {
  const params = new URLSearchParams(window.location.search);
  currentSearchQuery = params.get('q') || '';
  
  if (currentSearchQuery) {
    document.getElementById('searchTitle').textContent = `Search Results for "${currentSearchQuery}"`;
    document.getElementById('newSearchInput').value = currentSearchQuery;
    performSearch();
  }
  
  document.getElementById('newSearchBtn').addEventListener('click', () => {
    currentSearchQuery = document.getElementById('newSearchInput').value;
    if (currentSearchQuery.trim()) {
      window.location.href = 'search.html?q=' + encodeURIComponent(currentSearchQuery);
    }
  });
  
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      currentFilter = e.target.dataset.filter;
      performSearch();
    });
  });
  
  document.getElementById('vegOnly').addEventListener('change', (e) => {
    currentVegOnly = e.target.checked;
    performSearch();
  });
  
  document.getElementById('sortBy').addEventListener('change', (e) => {
    currentSortBy = e.target.value;
    performSearch();
  });
}

function performSearch() {
  const results = searchFoods(currentSearchQuery);
  let filtered = results;
  
  // Filter by type
  if (currentFilter === 'restaurants') {
    filtered = filtered.filter(r => r.type === 'restaurant');
  } else if (currentFilter === 'foods') {
    filtered = filtered.filter(r => r.type === 'food');
  }
  
  // Filter veg only
  if (currentVegOnly) {
    filtered = filtered.filter(r => {
      if (r.type === 'restaurant') {
        return r.data.isVegOnly || !r.data.foods.some(f => !f.veg);
      } else {
        return r.data.veg;
      }
    });
  }
  
  // Sort results
  filtered.sort((a, b) => {
    if (currentSortBy === 'price-low') {
      const priceA = a.type === 'food' ? a.data.price : Math.min(...a.data.foods.map(f => f.price));
      const priceB = b.type === 'food' ? b.data.price : Math.min(...b.data.foods.map(f => f.price));
      return priceA - priceB;
    } else if (currentSortBy === 'price-high') {
      const priceA = a.type === 'food' ? a.data.price : Math.max(...a.data.foods.map(f => f.price));
      const priceB = b.type === 'food' ? b.data.price : Math.max(...b.data.foods.map(f => f.price));
      return priceB - priceA;
    } else if (currentSortBy === 'rating') {
      const ratingA = a.type === 'restaurant' ? a.data.rating : a.restaurant.rating;
      const ratingB = b.type === 'restaurant' ? b.data.rating : b.restaurant.rating;
      return ratingB - ratingA;
    } else if (currentSortBy === 'delivery-time') {
      const timeA = a.type === 'restaurant' ? parseInt(a.data.deliveryTime) : parseInt(a.restaurant.deliveryTime);
      const timeB = b.type === 'restaurant' ? parseInt(b.data.deliveryTime) : parseInt(b.restaurant.deliveryTime);
      return timeA - timeB;
    }
    return 0;
  });
  
  displaySearchResults(filtered);
}

function displaySearchResults(results) {
  const container = document.getElementById('resultsContainer');
  
  if (results.length === 0) {
    container.innerHTML = `<div class="no-results">
      <p>No results found for "${currentSearchQuery}"</p>
      <p>Try searching for other restaurants or dishes</p>
    </div>`;
    return;
  }
  
  let html = '';
  
  results.forEach(result => {
    if (result.type === 'restaurant') {
      html += `
        <div class="search-result-card restaurant-result">
          <img src="${result.data.image}" alt="${result.data.name}">
          <div class="result-info">
            <h3>${result.data.name}</h3>
            <p class="cuisine">${result.data.cuisine.join(' • ')}</p>
            <div class="result-meta">
              <span>⭐ ${result.data.rating}</span>
              <span>⏱️ ${result.data.deliveryTime}</span>
              <span>₹${result.data.deliveryFee} delivery</span>
            </div>
            <a href="restaurant_detail.html?id=${result.data.id}" class="view-btn">View Restaurant</a>
          </div>
        </div>
      `;
    } else {
      html += `
        <div class="search-result-card food-result">
          <img src="${result.data.img}" alt="${result.data.name}">
          <div class="result-info">
            <h3>${result.data.name}</h3>
            <p class="restaurant-name">From: ${result.restaurant.name}</p>
            <div class="result-meta">
              <span class="price">₹${result.data.price}</span>
              <span>${result.data.veg ? '🥬 Veg' : '🍗 Non-Veg'}</span>
            </div>
            <button onclick="addFoodToCart('${result.data.name.replace(/'/g, "\\'")}', ${result.data.price}, '${result.data.img.replace(/'/g, "\\'")}')" class="add-btn">Add to Cart</button>
          </div>
        </div>
      `;
    }
  });
  
  container.innerHTML = html;
}

function addFoodToCart(name, price, img) {
  if (cart[name]) {
    cart[name].qty++;
  } else {
    cart[name] = { name, price, qty: 1, img, category: 'food' };
  }
  updateCart();
  showNotification(`${name} added to cart!`);
}

window.addEventListener('load', initSearchPage);
</script>
</body>
</html>
